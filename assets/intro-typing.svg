<svg xmlns="http://www.w3.org/2000/svg" width="600" height="66" viewBox="0 0 600 66" role="img" aria-labelledby="title desc">
  <title id="title">Hey, I am electrifiedchan</title>
  <desc id="desc">A gently repeating typewriter introduction. Reduced-motion viewers see the complete line.</desc>
  <style>
    text { fill: #1f2328; }
    .typing-window { animation: typing 9s steps(25, end) infinite; }
    .cursor { fill: #d99045; animation: travel 9s steps(25, end) infinite, blink 1.2s step-end infinite; }
    @keyframes typing {
      0%, 8% { width: 0; }
      50%, 86% { width: 480px; }
      96%, 100% { width: 0; }
    }
    @keyframes travel {
      0%, 8% { transform: translateX(0); }
      50%, 86% { transform: translateX(480px); }
      96%, 100% { transform: translateX(0); }
    }
    @keyframes blink {
      0%, 45% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-color-scheme: dark) { text { fill: #e6edf3; } }
    @media (prefers-reduced-motion: reduce) {
      .typing-window { animation: none; width: 480px; }
      .cursor { display: none; }
    }
  </style>
  <defs>
    <clipPath id="typing-clip">
      <rect class="typing-window" width="480" height="66" />
    </clipPath>
  </defs>
  <g transform="translate(60 0)">
    <text x="0" y="44" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="32" font-weight="600" textLength="480" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing-clip)">Hey, I am electrifiedchan</text>
    <rect class="cursor" x="0" y="17" width="3" height="34" rx="1" />
  </g>
</svg>
