<svg xmlns="http://www.w3.org/2000/svg" width="600" height="66" viewBox="0 0 600 66" role="img" aria-labelledby="title desc">
  <title id="title">Hey, I am electrifiedchan</title>
  <desc id="desc">A gently repeating typewriter introduction. Reduced-motion viewers see the complete line.</desc>
  <style>
    text { fill: #1f2328; }
    .typing-window { animation: typing 7.5s steps(25, end) infinite; }
    .cursor { fill: #d99045; animation: travel 7.5s steps(25, end) infinite, pause-blink 7.5s step-end infinite; }
    @keyframes typing {
      0%, 8% { width: 0; }
      50%, 86% { width: 500px; }
      96%, 100% { width: 0; }
    }
    @keyframes travel {
      0%, 8% { transform: translateX(0); }
      50%, 86% { transform: translateX(500px); }
      96%, 100% { transform: translateX(0); }
    }
    @keyframes pause-blink {
      0%, 50% { opacity: 1; }
      58% { opacity: 0; }
      64% { opacity: 1; }
      70% { opacity: 0; }
      76% { opacity: 1; }
      82% { opacity: 0; }
      86%, 100% { opacity: 1; }
    }
    @media (prefers-color-scheme: dark) { text { fill: #e6edf3; } }
    @media (prefers-reduced-motion: reduce) {
      .typing-window { animation: none; width: 500px; }
      .cursor { display: none; }
    }
  </style>
  <defs>
    <clipPath id="typing-clip">
      <rect class="typing-window" width="500" height="66" />
    </clipPath>
  </defs>
  <g transform="translate(50 0)">
    <!-- 25 characters on a shared 20px grid; the cursor advances one cell per letter. -->
    <text x="0 20 40 60 80 100 120 140 160 180 200 220 240 260 280 300 320 340 360 380 400 420 440 460 480" y="44" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="32" font-weight="600" clip-path="url(#typing-clip)">Hey, I am electrifiedchan</text>
    <rect class="cursor" x="0" y="17" width="3" height="34" rx="1" />
  </g>
</svg>
